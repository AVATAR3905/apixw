[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airfare-price-observatory"
version = "0.1.0"
description = "High-Frequency Real-Time Airfare Price Index & Observatory for India (MoSPI / NSO)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Airfare Observatory Engineering Team" }
]
# NOTE: This list is deliberately the trimmed Vercel-deploy dependency set
# (kept in sync with api/requirements.txt), not the full local-dev stack --
# Vercel's Python builder resolves dependencies from this file (it takes
# precedence over api/requirements.txt), while local dev and GitHub Actions
# both install from the repo-root requirements.txt directly and never read
# this list. See the "deploy" extra below for the excluded scraping/OCR/ML
# packages (playwright, fast_flights, paddlepaddle, paddleocr, lightgbm,
# polars) -- those imports are lazy (see services/collectors,
# services/ml/training_pipeline.py) so the deployed API never touches them.
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.5.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "aiohttp>=3.10.0",
    "beautifulsoup4>=4.12.0",
    "PyYAML>=6.0.2",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
local = [
    "uvicorn[standard]>=0.30.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "polars>=1.6.0",
    "lightgbm>=4.5.0",
    "Pillow>=10.4.0",
    "playwright>=1.46.0",
    "fast_flights>=3.1.0",
    "redis>=5.0.8",
    "paddlepaddle>=3.2.1",
    "paddleocr[doc-parser]>=3.7.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "services*", "packages*", "database*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
