name: Collect Real Airfare Data

# Real-data collection (10 routes x 5 horizons: T+1/7/15/30/45, across
# SpiceJet, Akasa, Google Flights RPC, Ixigo, EaseMyTrip), targeting
# ~4x/day. This repo is public, so GitHub-hosted runner minutes are
# unlimited/free; none of the sources this script hits need an API key, but
# a DATABASE_URL repo secret (the shared Neon Postgres) is required.
#
# Runs HOURLY rather than at 4 fixed times, deliberately. The original
# design used 4 explicit crons at :30 past specific hours -- but :00 and
# :30 are the two most congested slots on GitHub's shared cron dispatcher
# (most scheduled workflows across every GitHub repo land on one of those
# two), and GitHub documents scheduled runs as best-effort: "can be delayed
# during periods of high loads... in the worst case, the workflow may not
# run." Confirmed in practice, not hypothetically: the 2026-10-11 06:00 IST
# slot never fired at all (next run found 6.5+ hours later, no trace of the
# missed one -- not a slow run, a dropped one), required a manual
# workflow_dispatch to recover same-day data.
#
# Fix: trigger hourly at :07 (clear of both congested slots) instead of 4x
# at :30. trigger_collection_cycle's own dedup (services/scheduler/
# collection_scheduler.py) already treats "already collected within the
# last ~5.5h" as done and skips straight back out -- cheap, no real
# scraping -- so this doesn't turn into 24 real collections/day, it stays
# ~4/day. What changes is resilience: a single real collection window now
# has ~5-6 separate hourly chances to fire, not one -- GitHub would have to
# drop nearly all of them in the same window for a gap to recur, versus
# previously needing to drop exactly one specific cron to cause one.
#
# Writes straight into the shared Neon Postgres DB (via the DATABASE_URL
# repo secret) that the deployed Vercel API also reads from -- the same DB
# the dashboard shows live, no separate sync/ingest step. The local SQLite
# file (airfare_observatory.db) is no longer updated or committed by this
# workflow; it stays purely a local-dev fallback (see database/session.py).
#
# Known real tradeoff, not a hypothetical: GitHub's runners are datacenter
# IPs, the same class of address IndiGo is already confirmed to block on IP
# reputation alone. This can degrade or newly block sources that work fine
# from a home connection (SpiceJet/Akasa/Ixigo/EaseMyTrip) -- watch the
# jobs_success/jobs_failed split in the first several runs (search this
# workflow's logs for "FULL-BASKET COLLECTION COMPLETE") before relying on
# this as the primary collection path.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: apix-collection
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run full-basket real-data collection
        run: python scripts/collect_full_real_coverage.py
        env:
          SCRAPE_MODE: live
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
