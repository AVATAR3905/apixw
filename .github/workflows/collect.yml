name: Collect Real Airfare Data

# Real-data collection (10 routes x 5 horizons: T+1/7/15/30/45, across
# SpiceJet, Akasa, Google Flights RPC, Ixigo, EaseMyTrip), targeting
# ~4x/day. This repo is public, so GitHub-hosted runner minutes are
# unlimited/free; none of the sources this script hits need an API key, but
# a DATABASE_URL repo secret (the shared Neon Postgres) is required.
#
# The original design used 4 explicit crons at :30 past specific hours --
# but :00 and :30 are the two most congested slots on GitHub's shared cron
# dispatcher (most scheduled workflows across every GitHub repo land on one
# of those two), and GitHub documents scheduled runs as best-effort: "can be
# delayed during periods of high loads... in the worst case, the workflow
# may not run." Confirmed in practice: the 2026-10-11 06:00 IST slot never
# fired at all (required a manual workflow_dispatch to recover same-day
# data).
#
# First attempt at a fix tried hourly triggers (24x/day) for redundancy --
# that was wrong and made things worse, not better: it moved this workflow
# into the same "high-frequency schedule" territory that keep_warm.yml (see
# that workflow's own postmortem comment) had already proven GitHub throttles
# far more aggressively than a low-frequency one -- confirmed by watching it:
# 11.5 hours, zero firings, not a slow run but a near-total drop streak. The
# *original* problem was landing on the congested :30 minute at low (4x/day)
# frequency, which was otherwise reliable; swapping to high frequency solved
# nothing and introduced the worse, already-known failure mode.
#
# Actual fix: stay low-frequency (now 8x/day, not 24x) but move off the
# congested minute, and add one offset backup per target window instead of
# relying on exactly one trigger. Each pair is ~3h apart; trigger_collection_
# cycle's own dedup (services/scheduler/collection_scheduler.py, ~5.5h
# freshness window) means the backup is a cheap no-op skip if the primary
# already succeeded, and a real recovery if it didn't.
#
# Writes straight into the shared Neon Postgres DB (via the DATABASE_URL
# repo secret) that the deployed Vercel API also reads from -- the same DB
# the dashboard shows live, no separate sync/ingest step. The local SQLite
# file (airfare_observatory.db) is no longer updated or committed by this
# workflow; it stays purely a local-dev fallback (see database/session.py).
#
# Known real tradeoff, not a hypothetical: GitHub's runners are datacenter
# IPs, the same class of address IndiGo is already confirmed to block on IP
# reputation alone. This can degrade or newly block sources that work fine
# from a home connection (SpiceJet/Akasa/Ixigo/EaseMyTrip) -- watch the
# jobs_success/jobs_failed split in the first several runs (search this
# workflow's logs for "FULL-BASKET COLLECTION COMPLETE") before relying on
# this as the primary collection path.

on:
  schedule:
    # Primary targets (IST 06:00/12:00/18:00/23:00, minute shifted off :30):
    - cron: "7 0 * * *"
    - cron: "7 6 * * *"
    - cron: "7 12 * * *"
    - cron: "7 17 * * *"
    # Backups, ~3h after each primary, same window (dedup skips if the
    # primary already succeeded):
    - cron: "7 3 * * *"
    - cron: "7 9 * * *"
    - cron: "7 15 * * *"
    - cron: "7 20 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: apix-collection
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run full-basket real-data collection
        run: python scripts/collect_full_real_coverage.py
        env:
          SCRAPE_MODE: live
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
