services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: airfare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airfare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airfare_pass}
      POSTGRES_DB: ${POSTGRES_DB:-airfare_observatory}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airfare_user} -d ${POSTGRES_DB:-airfare_observatory}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: airfare_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
